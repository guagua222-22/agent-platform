<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Platform 演示台</title>
<style>
  /* 演示台样式：深色主题，重点突出"Agent 思考过程"的事件流可视化 */
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --ok: #34c08c;
    --err: #e05d5d;
    --tool: #c07df0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: 4px; }
  header select {
    margin-left: auto; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; outline: none;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 76%; display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; font-size: 14px;
    line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg .who { font-size: 11px; color: var(--muted); }
  /* 事件流时间线：演示 Agent 内部过程的核心视觉 */
  .trace {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .trace .trace-title { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .trace .step { display: flex; gap: 8px; align-items: baseline; }
  .trace .tag {
    min-width: 108px; font-family: Consolas, monospace; font-size: 11px;
    color: var(--muted);
  }
  .trace .tag.TOOL_CALLED { color: var(--tool); }
  .trace .tag.TOOL_RESULT { color: var(--ok); }
  .trace .tag.RUN_FAILED { color: var(--err); }
  .trace .tag.RUN_COMPLETED { color: var(--accent); }
  .trace .tag.PLAN_GENERATED { color: #f0c05a; }
  .trace .tag.PLAN_STEP_STARTED,
  .trace .tag.PLAN_STEP_COMPLETED { color: #5ac8f0; }
  .trace .tag.MEMORY_LOADED { color: #9adf8f; }
  .trace .detail { color: var(--text); word-break: break-all; }
  .bubble.err { border-color: var(--err); color: var(--err); }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  footer input {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; outline: none;
  }
  footer input:focus { border-color: var(--accent); }
  footer button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 0 22px; font-size: 14px;
    cursor: pointer; transition: opacity .15s;
  }
  footer button:disabled { opacity: .45; cursor: not-allowed; }
  #send-async { background: transparent; border: 1px solid var(--border); color: var(--text); }
  #send-async:hover { border-color: var(--accent); color: var(--accent); }
  .trace .tag.TASK_STATE { color: #f0c05a; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 知识库面板（模态） */
  #kb-btn, #conv-btn {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  #kb-btn:hover, #conv-btn:hover { border-color: var(--accent); color: var(--accent); }
  #conv-label { color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
  #kb-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 10; align-items: center; justify-content: center;
  }
  #kb-modal.open { display: flex; }
  .kb-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: min(720px, 92vw); max-height: 84vh; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .kb-panel h2 { font-size: 15px; }
  .kb-panel .close {
    margin-left: auto; background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer;
  }
  .kb-row { display: flex; gap: 10px; align-items: center; }
  .kb-panel input[type="text"], .kb-panel textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit;
  }
  .kb-panel textarea { width: 100%; min-height: 140px; resize: vertical; }
  .kb-panel .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .kb-panel .btn:disabled { opacity: .5; cursor: not-allowed; }
  .kb-panel .hint-text { font-size: 12px; color: var(--muted); }
  .kb-doc {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; display: flex; gap: 10px; align-items: center;
  }
  .kb-doc .st { color: var(--ok); }
  .kb-hit {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 13px; display: flex; flex-direction: column; gap: 4px;
  }
  .kb-hit .score { color: var(--accent); font-size: 12px; }
  .kb-hit .src { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Agent Platform <span class="sub">Harness 构建 · Runtime 执行 · 事件流实时可见</span></h1>
  <select id="agent-select" title="选择 Agent"></select>
  <span id="conv-label" title="当前会话 ID：同一会话内的消息会进入记忆（短期窗口 + 长期摘要）"></span>
  <button id="conv-btn" title="换一个会话 ID，开始一段全新对话（记忆随之切换）">新会话</button>
  <button id="kb-btn" title="上传文档、查看知识库与向量检索">知识库</button>
</header>

<div id="chat">
  <div class="hint">选择 Agent，输入问题，观察右侧时间线里模型如何"思考→调工具→回答"</div>
</div>

<footer>
  <input id="input" placeholder="例如：23*47 等于多少" autocomplete="off">
  <button id="send">发送</button>
  <button id="send-async" title="走 RocketMQ 任务队列：提交即返回，后台异步执行，轮询结果">
    异步提交</button>
</footer>

<!-- 知识库面板：上传文档 → 入库（切分+向量化+Milvus）→ 检索验证 -->
<div id="kb-modal">
  <div class="kb-panel">
    <div class="kb-row">
      <h2>知识库管理</h2>
      <button class="close" id="kb-close">&times;</button>
    </div>

    <div>
      <div class="kb-row">
        <input type="text" id="kb-title" placeholder="文档标题（如：项目路线图）" style="flex:1">
        <input type="file" id="kb-file" accept=".txt,.md" style="display:none">
        <button class="btn" id="kb-pick" style="background:transparent;border:1px solid var(--border);color:var(--text)">选择文件</button>
      </div>
      <textarea id="kb-content" placeholder="粘贴文档内容，或点击"选择文件"读取本地 .txt/.md 文件"></textarea>
      <div class="kb-row" style="margin-top:8px">
        <button class="btn" id="kb-upload">上传入库</button>
        <span class="hint-text" id="kb-upload-msg"></span>
      </div>
    </div>

    <div>
      <h2 style="margin-bottom:8px">已入库文档</h2>
      <div id="kb-docs" class="hint-text">加载中…</div>
    </div>

    <div>
      <h2 style="margin-bottom:8px">向量检索测试</h2>
      <div class="kb-row">
        <input type="text" id="kb-query" placeholder="输入检索问题，如：什么是 Agent Harness" style="flex:1">
        <button class="btn" id="kb-search">检索</button>
      </div>
      <div id="kb-hits" style="margin-top:8px;display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const selectEl = document.getElementById('agent-select');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const convLabel = document.getElementById('conv-label');
  const convBtn = document.getElementById('conv-btn');

  // 会话 ID：记忆分层的客户端锚点。存 localStorage，刷新页面不丢；
  // 后端按它把消息存档进 MySQL，下次对话注入"摘要 + 最近窗口"
  let conversationId = localStorage.getItem('agent-conversation-id');
  if (!conversationId) {
    conversationId = crypto.randomUUID();
    localStorage.setItem('agent-conversation-id', conversationId);
  }
  function renderConvLabel() {
    convLabel.textContent = '会话 ' + conversationId.slice(0, 8);
  }
  renderConvLabel();

  convBtn.addEventListener('click', () => {
    conversationId = crypto.randomUUID();
    localStorage.setItem('agent-conversation-id', conversationId);
    renderConvLabel();
    chatEl.innerHTML = '<div class="hint">已开启新会话（旧会话消息仍在 MySQL，切回 ID 即可恢复记忆）</div>';
  });

  // 加载 Agent 列表（GET /api/agents，由 AgentConfig 装配的注册表提供）
  async function loadAgents() {
    try {
      const resp = await fetch('/api/agents');
      const agents = await resp.json();
      selectEl.innerHTML = '';
      for (const a of agents) {
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.name + ' [' + a.loop + '] — ' + a.description;
        selectEl.appendChild(opt);
      }
    } catch (e) {
      selectEl.innerHTML = '<option>Agent 列表加载失败，应用是否已启动？</option>';
    }
  }

  function addUserMessage(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    wrap.innerHTML = '<div class="who">你</div><div class="bubble"></div>';
    wrap.querySelector('.bubble').textContent = text;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // 创建一条 agent 消息：时间线 + 最终回答气泡，返回更新句柄
  function addAgentMessage(agentName) {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.innerHTML = '<div class="who">' + agentName + '</div>' +
      '<div class="trace"><div class="trace-title">思考过程（事件流）</div></div>' +
      '<div class="bubble"><span class="spinner"></span> 运行中…</div>';
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return {
      wrap,
      trace: wrap.querySelector('.trace'),
      bubble: wrap.querySelector('.bubble'),
    };
  }

  function addTraceStep(trace, event, data) {
    const step = document.createElement('div');
    step.className = 'step';
    step.innerHTML = '<span class="tag ' + event + '">' + event + '</span><span class="detail"></span>';
    step.querySelector('.detail').textContent = data;
    trace.appendChild(step);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // 解析 SSE 块：SseEmitter 输出 "event:XXX\ndata:YYY\n\n" 格式
  function parseSseChunk(chunk) {
    let event = 'message', data = '';
    for (const line of chunk.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    return { event, data };
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    addUserMessage(text);
    const view = addAgentMessage(selectEl.value);

    try {
      // POST + 流式读取：EventSource 只支持 GET，SSE 流用 fetch ReadableStream 解析。
      // conversationId 随请求上送，后端据此加载/回写会话记忆
      const resp = await fetch('/api/agents/' + encodeURIComponent(selectEl.value) +
        '/chat?message=' + encodeURIComponent(text) +
        '&conversationId=' + encodeURIComponent(conversationId), { method: 'POST' });
      if (!resp.ok) {
        view.bubble.className = 'bubble err';
        view.bubble.textContent = resp.status === 429
          ? 'HTTP 429：请求过于频繁（限流生效），稍等片刻再试'
          : 'HTTP ' + resp.status + '（检查应用是否启动、AI_API_KEY 是否配置）';
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const { event, data } = parseSseChunk(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
          if (event === 'RUN_COMPLETED') {
            // detail 形如 "answer=..."，提取回答正文作为最终气泡
            const answer = data.startsWith('answer=') ? data.slice(7) : data;
            view.bubble.textContent = answer || '(空回答)';
          } else if (event === 'RUN_FAILED') {
            view.bubble.className = 'bubble err';
            view.bubble.textContent = '运行失败：' + data;
          } else {
            addTraceStep(view.trace, event, data);
          }
        }
      }
      if (view.bubble.textContent.includes('运行中')) {
        view.bubble.className = 'bubble err';
        view.bubble.textContent = '连接中断，未收到终态事件';
      }
    } catch (e) {
      view.bubble.className = 'bubble err';
      view.bubble.textContent = '请求失败：' + e.message;
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  // ===== 异步任务通道（M3-B：RocketMQ 队列） =====
  // 与同步 SSE 通道的分工：SSE 看过程，队列要结果。
  // 提交 → 202 拿 taskId → 每 2s 轮询 /api/tasks/{id} 直到终态（COMPLETED/FAILED）
  const asyncBtn = document.getElementById('send-async');

  async function sendAsync() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    asyncBtn.disabled = true;
    sendBtn.disabled = true;
    addUserMessage(text);
    const view = addAgentMessage(selectEl.value + ' [异步]');

    try {
      const resp = await fetch('/api/tasks?agent=' + encodeURIComponent(selectEl.value) +
        '&message=' + encodeURIComponent(text) +
        '&conversationId=' + encodeURIComponent(conversationId), { method: 'POST' });
      if (!resp.ok) {
        view.bubble.className = 'bubble err';
        view.bubble.textContent = resp.status === 429
          ? 'HTTP 429：请求过于频繁（限流生效），稍等片刻再试'
          : 'HTTP ' + resp.status + '（任务提交失败，RocketMQ 容器是否已启动？）';
        return;
      }
      const submitted = await resp.json();
      addTraceStep(view.trace, 'TASK_STATE', 'QUEUED · taskId=' + submitted.taskId.slice(0, 8) + '…');
      view.bubble.textContent = '已入队，后台执行中…';

      // 轮询终态：演示环境 2s 间隔足够；生产可用指数退避或 WebSocket 推送替代
      let lastState = 'QUEUED';
      const poll = setInterval(async () => {
        try {
          const s = await (await fetch('/api/tasks/' + submitted.taskId)).json();
          if (s.state !== lastState) {
            lastState = s.state;
            addTraceStep(view.trace, 'TASK_STATE', s.state);
          }
          if (s.state === 'COMPLETED' || s.state === 'FAILED') {
            clearInterval(poll);
            if (s.state === 'COMPLETED') {
              view.bubble.textContent = s.finalAnswer || '(空回答)';
            } else {
              view.bubble.className = 'bubble err';
              view.bubble.textContent = '运行失败：' + (s.error || '未知错误');
            }
            asyncBtn.disabled = false;
            sendBtn.disabled = false;
          }
        } catch (e) {
          // 单次轮询失败不停表：网络抖动不应终止整个任务视图
        }
      }, 2000);
      // 5 分钟兜底超时：防止任务卡死导致前端无限轮询
      setTimeout(() => {
        clearInterval(poll);
        if (view.bubble.textContent.includes('后台执行中')) {
          view.bubble.className = 'bubble err';
          view.bubble.textContent = '轮询超时（5 分钟）：任务可能仍在执行，可用 taskId 手动查询';
          asyncBtn.disabled = false;
          sendBtn.disabled = false;
        }
      }, 5 * 60 * 1000);
    } catch (e) {
      view.bubble.className = 'bubble err';
      view.bubble.textContent = '请求失败：' + e.message;
      asyncBtn.disabled = false;
      sendBtn.disabled = false;
    }
  }

  asyncBtn.addEventListener('click', sendAsync);
  loadAgents();

  // ===== 知识库面板 =====
  const kbModal = document.getElementById('kb-modal');
  const kbBtn = document.getElementById('kb-btn');
  const kbClose = document.getElementById('kb-close');
  const kbTitle = document.getElementById('kb-title');
  const kbContent = document.getElementById('kb-content');
  const kbFile = document.getElementById('kb-file');
  const kbPick = document.getElementById('kb-pick');
  const kbUpload = document.getElementById('kb-upload');
  const kbUploadMsg = document.getElementById('kb-upload-msg');
  const kbDocs = document.getElementById('kb-docs');
  const kbQuery = document.getElementById('kb-query');
  const kbSearchBtn = document.getElementById('kb-search');
  const kbHits = document.getElementById('kb-hits');

  kbBtn.addEventListener('click', () => { kbModal.classList.add('open'); loadKbDocs(); });
  kbClose.addEventListener('click', () => kbModal.classList.remove('open'));
  kbModal.addEventListener('click', e => { if (e.target === kbModal) kbModal.classList.remove('open'); });

  // 本地文件读取：.txt/.md 直接读为文本填入内容区（上传仍走 JSON API）
  kbPick.addEventListener('click', () => kbFile.click());
  kbFile.addEventListener('change', () => {
    const file = kbFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      kbContent.value = String(reader.result || '');
      if (!kbTitle.value) kbTitle.value = file.name.replace(/\.(txt|md)$/i, '');
      kbUploadMsg.textContent = '已读取 ' + file.name + '（' + (file.size / 1024).toFixed(1) + ' KB）';
    };
    reader.readAsText(file);
  });

  // 上传：POST /api/knowledge/docs —— 后端完成 解析→切分→向量化→Milvus 入库
  kbUpload.addEventListener('click', async () => {
    const title = kbTitle.value.trim();
    const content = kbContent.value.trim();
    if (!title || !content) {
      kbUploadMsg.textContent = '标题与内容不能为空';
      return;
    }
    kbUpload.disabled = true;
    kbUploadMsg.textContent = '入库中（切分 + 向量化 + Milvus 写入）…';
    try {
      const resp = await fetch('/api/knowledge/docs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content }),
      });
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error('HTTP ' + resp.status + ' ' + err.slice(0, 120));
      }
      const result = await resp.json();
      kbUploadMsg.textContent = '入库成功：' + result.chunkCount + ' 个分块（docId=' + result.docId.slice(0, 8) + '…）';
      kbContent.value = '';
      kbTitle.value = '';
      loadKbDocs();
    } catch (e) {
      kbUploadMsg.textContent = '入库失败：' + e.message;
    } finally {
      kbUpload.disabled = false;
    }
  });

  async function loadKbDocs() {
    try {
      const resp = await fetch('/api/knowledge/docs');
      const docs = await resp.json();
      if (!docs.length) {
        kbDocs.textContent = '（暂无文档，上传一篇试试）';
        return;
      }
      kbDocs.innerHTML = '';
      for (const d of docs) {
        const div = document.createElement('div');
        div.className = 'kb-doc';
        div.innerHTML = '<span class="st">' + d.status + '</span>' +
          '<span style="flex:1">' + d.title + '</span>' +
          '<span class="hint-text">' + d.chunkCount + ' 块 · ' +
          new Date(d.createdAt).toLocaleString() + '</span>';
        kbDocs.appendChild(div);
      }
    } catch (e) {
      kbDocs.textContent = '文档列表加载失败：' + e.message;
    }
  }

  // 检索：GET /api/knowledge/search —— 后端走 embedding 向量化 + Milvus HNSW 检索
  kbSearchBtn.addEventListener('click', async () => {
    const q = kbQuery.value.trim();
    if (!q) return;
    kbHits.innerHTML = '<span class="hint-text">检索中…</span>';
    try {
      const resp = await fetch('/api/knowledge/search?q=' + encodeURIComponent(q) + '&topK=5');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const hits = await resp.json();
      kbHits.innerHTML = '';
      if (!hits.length) {
        kbHits.innerHTML = '<span class="hint-text">无命中（知识库为空或语义距离过远）</span>';
        return;
      }
      for (const h of hits) {
        const div = document.createElement('div');
        div.className = 'kb-hit';
        div.innerHTML = '<span class="src">来源《' + h.docTitle + '》片段 ' + h.seq +
          '</span><span class="score">相关度 ' + h.score.toFixed(4) + '（COSINE）</span>' +
          '<span></span>';
        div.querySelector('span:last-child').textContent = h.content.slice(0, 300);
        kbHits.appendChild(div);
      }
    } catch (e) {
      kbHits.innerHTML = '<span class="hint-text">检索失败：' + e.message + '</span>';
    }
  });
</script>
</body>
</html>
