<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Platform 演示台</title>
<style>
  /* 演示台样式：深色主题，重点突出"Agent 思考过程"的事件流可视化 */
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --ok: #34c08c;
    --err: #e05d5d;
    --tool: #c07df0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: 4px; }
  header select {
    margin-left: auto; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; outline: none;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 76%; display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; font-size: 14px;
    line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg .who { font-size: 11px; color: var(--muted); }
  /* 事件流时间线：演示 Agent 内部过程的核心视觉 */
  .trace {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .trace .trace-title { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .trace .step { display: flex; gap: 8px; align-items: baseline; }
  .trace .tag {
    min-width: 108px; font-family: Consolas, monospace; font-size: 11px;
    color: var(--muted);
  }
  .trace .tag.TOOL_CALLED { color: var(--tool); }
  .trace .tag.TOOL_RESULT { color: var(--ok); }
  .trace .tag.RUN_FAILED { color: var(--err); }
  .trace .tag.RUN_COMPLETED { color: var(--accent); }
  .trace .detail { color: var(--text); word-break: break-all; }
  .bubble.err { border-color: var(--err); color: var(--err); }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  footer input {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; outline: none;
  }
  footer input:focus { border-color: var(--accent); }
  footer button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 0 22px; font-size: 14px;
    cursor: pointer; transition: opacity .15s;
  }
  footer button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Agent Platform <span class="sub">Harness 构建 · Runtime 执行 · 事件流实时可见</span></h1>
  <select id="agent-select" title="选择 Agent"></select>
</header>

<div id="chat">
  <div class="hint">选择 Agent，输入问题，观察右侧时间线里模型如何"思考→调工具→回答"</div>
</div>

<footer>
  <input id="input" placeholder="例如：23*47 等于多少" autocomplete="off">
  <button id="send">发送</button>
</footer>

<script>
  const chatEl = document.getElementById('chat');
  const selectEl = document.getElementById('agent-select');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // 加载 Agent 列表（GET /api/agents，由 AgentConfig 装配的注册表提供）
  async function loadAgents() {
    try {
      const resp = await fetch('/api/agents');
      const agents = await resp.json();
      selectEl.innerHTML = '';
      for (const a of agents) {
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.name + ' — ' + a.description;
        selectEl.appendChild(opt);
      }
    } catch (e) {
      selectEl.innerHTML = '<option>Agent 列表加载失败，应用是否已启动？</option>';
    }
  }

  function addUserMessage(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    wrap.innerHTML = '<div class="who">你</div><div class="bubble"></div>';
    wrap.querySelector('.bubble').textContent = text;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // 创建一条 agent 消息：时间线 + 最终回答气泡，返回更新句柄
  function addAgentMessage(agentName) {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.innerHTML = '<div class="who">' + agentName + '</div>' +
      '<div class="trace"><div class="trace-title">思考过程（事件流）</div></div>' +
      '<div class="bubble"><span class="spinner"></span> 运行中…</div>';
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return {
      wrap,
      trace: wrap.querySelector('.trace'),
      bubble: wrap.querySelector('.bubble'),
    };
  }

  function addTraceStep(trace, event, data) {
    const step = document.createElement('div');
    step.className = 'step';
    step.innerHTML = '<span class="tag ' + event + '">' + event + '</span><span class="detail"></span>';
    step.querySelector('.detail').textContent = data;
    trace.appendChild(step);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // 解析 SSE 块：SseEmitter 输出 "event:XXX\ndata:YYY\n\n" 格式
  function parseSseChunk(chunk) {
    let event = 'message', data = '';
    for (const line of chunk.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    return { event, data };
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    addUserMessage(text);
    const view = addAgentMessage(selectEl.value);

    try {
      // POST + 流式读取：EventSource 只支持 GET，SSE 流用 fetch ReadableStream 解析
      const resp = await fetch('/api/agents/' + encodeURIComponent(selectEl.value) +
        '/chat?message=' + encodeURIComponent(text), { method: 'POST' });
      if (!resp.ok) {
        view.bubble.className = 'bubble err';
        view.bubble.textContent = resp.status === 429
          ? 'HTTP 429：请求过于频繁（限流生效），稍等片刻再试'
          : 'HTTP ' + resp.status + '（检查应用是否启动、AI_API_KEY 是否配置）';
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const { event, data } = parseSseChunk(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
          if (event === 'RUN_COMPLETED') {
            // detail 形如 "answer=..."，提取回答正文作为最终气泡
            const answer = data.startsWith('answer=') ? data.slice(7) : data;
            view.bubble.textContent = answer || '(空回答)';
          } else if (event === 'RUN_FAILED') {
            view.bubble.className = 'bubble err';
            view.bubble.textContent = '运行失败：' + data;
          } else {
            addTraceStep(view.trace, event, data);
          }
        }
      }
      if (view.bubble.textContent.includes('运行中')) {
        view.bubble.className = 'bubble err';
        view.bubble.textContent = '连接中断，未收到终态事件';
      }
    } catch (e) {
      view.bubble.className = 'bubble err';
      view.bubble.textContent = '请求失败：' + e.message;
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  loadAgents();
</script>
</body>
</html>
