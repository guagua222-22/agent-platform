spring:
  application:
    name: agent-platform
  ai:
    openai:
      # API Key 一律走环境变量：密钥进配置文件/进 git 是生产事故级错误
      api-key: ${AI_API_KEY}
      # 千问（DashScope）的 OpenAI 兼容端点；将来接 DeepSeek 只需改为
      # https://api.deepseek.com 并把 model 换成 deepseek-chat，代码零改动
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        # 关键：Spring AI 默认拼 {base-url}/v1/chat/completions，而 DashScope 的
        # base-url 已含 /compatible-mode/v1，不覆盖会拼成 .../v1/v1/chat/completions → 404
        completions-path: /chat/completions
        options:
          # qwen-plus：工具调用稳定且成本低；qwen-flash 更便宜适合高频压测
          model: qwen-plus
          # 温度 0.3：任务型 Agent 需要稳定而非发散，温度过高会让工具调用格式漂移
          temperature: 0.3
          max-tokens: 2000

  datasource:
    # 3307：本机原生 MySQL 服务占 3306，容器映射端口见 docker-compose.yml
    url: jdbc:mysql://localhost:3307/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:agent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 版本化迁移：任何环境从零启动都能重建到当前 schema（V1__init_agent_tables.sql）
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    # 模型请求/响应体日志：Agent 排障与成本审计的第一手证据（本地开发开 DEBUG，
    # 生产环境需降级并注意 body 可能含敏感数据）
    org.springframework.ai.openai: DEBUG
    org.springframework.web.client.RestClient: DEBUG
