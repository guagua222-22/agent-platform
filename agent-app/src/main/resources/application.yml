spring:
  application:
    name: agent-platform
  ai:
    openai:
      # API Key 一律走环境变量：密钥进配置文件/进 git 是生产事故级错误
      api-key: ${AI_API_KEY}
      # 千问（DashScope）的 OpenAI 兼容端点；将来接 DeepSeek 只需改为
      # https://api.deepseek.com 并把 model 换成 deepseek-chat，代码零改动
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        # 关键：Spring AI 默认拼 {base-url}/v1/chat/completions，而 DashScope 的
        # base-url 已含 /compatible-mode/v1，不覆盖会拼成 .../v1/v1/chat/completions → 404
        completions-path: /chat/completions
        options:
          # qwen-plus：工具调用稳定且成本低；qwen-flash 更便宜适合高频压测
          model: qwen-plus
          # 温度 0.3：任务型 Agent 需要稳定而非发散，温度过高会让工具调用格式漂移
          temperature: 0.3
          max-tokens: 2000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
